server.port=8081
server.servlet.context-path=/OpentelemetryService
# Gzip large JSON responses (only when the client sends Accept-Encoding: gzip).
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json,application/problem+json,text/plain,text/csv
server.compression.min-response-size=2048

# Pin the real origin in shared deployments, e.g. CORS_ALLOWED_ORIGINS=https://observability.example.com
cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://hcsjointstack.trinityiot.in}

# --- Startup configuration banner (see StartupConfigBanner) ---
startup.config-banner.enabled=${STARTUP_CONFIG_BANNER:true}
# Secrets print IN FULL unless this is true - set true anywhere shared.
startup.config-banner.mask-secrets=${STARTUP_CONFIG_BANNER_MASK:false}

# --- OpenObserve ---
openobserve.host=${OPENOBSERVE_HOST:http://192.168.100.235:5080/openobserve/}
openobserve.org=${OPENOBSERVE_ORG:default}
# Value INCLUDES the "Basic " prefix; do not prepend it again in code.
openobserve.auth-token=${OPENOBSERVE_AUTH_TOKEN:}
openobserve.logs-stream=default
openobserve.traces-stream=default
# Stream the browser RUM SDK writes into (all RUM event types share one stream).
openobserve.rum-data-stream=${OPENOBSERVE_RUM_DATA_STREAM:_rumdata}
openobserve.enabled=true

# --- Trace lookup by id ---
# Windows tried narrowest first (any order here), with the stream's own extent as the widest;
# the first one holding the trace's root span answers.
traces.lookup.windows=${TRACE_LOOKUP_WINDOWS:now-7d,now-24h,now-6h,now-1h}
# A root closer than this to a window's start (clock skew) sends the lookup to the next window.
traces.lookup.root-margin-seconds=${TRACE_LOOKUP_ROOT_MARGIN_SEC:300}
traces.lookup.stream-bounds-cache-seconds=${TRACE_LOOKUP_BOUNDS_CACHE_SEC:60}
# Safety ceiling, not a page size - a trace is never paginated.
traces.lookup.max-spans=${TRACE_LOOKUP_MAX_SPANS:10000}

# --- Product Catalog (registry of monitored resources, persisted in an OpenObserve stream) ---
product-catalog.enabled=${PRODUCT_CATALOG_ENABLED:true}
# EXCLUDE_DISABLED hides only disabled resources; ENABLED_ONLY shows only registered+enabled ones
# (no-op while the catalog is empty).
product-catalog.filter.mode=${PRODUCT_CATALOG_FILTER_MODE:ENABLED_ONLY}
product-catalog.filter.enabled=${PRODUCT_CATALOG_FILTER_ENABLED:true}
# Columns allowed in filter predicates per signal. Metrics must stay service_name only.
product-catalog.filter.columns.logs=service_name,k8s_deployment_name,k8s_namespace_name,host_name
product-catalog.filter.columns.traces=service_name,db_name,db_system
product-catalog.filter.columns.metrics=service_name

product-catalog.validation.required=${PRODUCT_CATALOG_VALIDATION_REQUIRED:true}
product-catalog.validation.window=${PRODUCT_CATALOG_VALIDATION_WINDOW:now-24h}
# Searched narrowest first, per signal. Required: this OpenObserve silently fails wide scans.
product-catalog.validation.fallback-windows=${PRODUCT_CATALOG_FALLBACK_WINDOWS:now-6h,now-1h}
product-catalog.validation.liveness-ttl-seconds=${PRODUCT_CATALOG_LIVENESS_TTL_SEC:60}
# Identifier probes, in priority order - keep the service_name probes first.
# stream: @logs / @traces map to the streams above; anything else is a literal stream name.
product-catalog.validation.probes[0].signal=logs
product-catalog.validation.probes[0].stream=@logs
product-catalog.validation.probes[0].column=service_name
product-catalog.validation.probes[1].signal=traces
product-catalog.validation.probes[1].stream=@traces
product-catalog.validation.probes[1].column=service_name
product-catalog.validation.probes[2].signal=metrics
product-catalog.validation.probes[2].stream=jvm_memory_used
product-catalog.validation.probes[2].column=service_name
product-catalog.validation.probes[3].signal=metrics
product-catalog.validation.probes[3].stream=application_health
product-catalog.validation.probes[3].column=service_name
product-catalog.validation.probes[4].signal=traces
product-catalog.validation.probes[4].stream=@traces
product-catalog.validation.probes[4].column=db_name
product-catalog.validation.probes[5].signal=traces
product-catalog.validation.probes[5].stream=@traces
product-catalog.validation.probes[5].column=db_system
product-catalog.validation.probes[6].signal=logs
product-catalog.validation.probes[6].stream=@logs
product-catalog.validation.probes[6].column=k8s_deployment_name
product-catalog.validation.probes[7].signal=logs
product-catalog.validation.probes[7].stream=@logs
product-catalog.validation.probes[7].column=k8s_namespace_name
product-catalog.validation.probes[8].signal=logs
product-catalog.validation.probes[8].stream=@logs
product-catalog.validation.probes[8].column=host_name
product-catalog.validation.probe-concurrency=${PRODUCT_CATALOG_PROBE_CONCURRENCY:9}
product-catalog.validation.discovery-cache-seconds=${PRODUCT_CATALOG_DISCOVERY_CACHE_SEC:120}

# OPENOBSERVE_STREAM persists changes; NONE is in-memory only (lost on restart).
product-catalog.persistence.mode=${PRODUCT_CATALOG_PERSISTENCE_MODE:OPENOBSERVE_STREAM}
product-catalog.persistence.stream=${PRODUCT_CATALOG_STREAM:product_catalog}
product-catalog.persistence.replay-days=${PRODUCT_CATALOG_REPLAY_DAYS:365}
# Optional seeding, e.g. product-catalog.seed[0].category=databases / .resource-name=PostgreSQL / .status=DISABLED

# --- Metric catalogue grouping ---
# Optional extra rules, format prefix:group:Technology (comma-separated), e.g.
# metrics.classification.extra-rules=rabbitmq_:middleware:RabbitMQ

# --- Service-to-metrics index (GET /api/metrics/producers) ---
metrics.producers.enabled=${METRICS_PRODUCERS_ENABLED:true}
# Do not shorten - slow collectors would silently drop out.
metrics.producers.window-seconds=${METRICS_PRODUCERS_WINDOW_SEC:3600}
metrics.producers.step-seconds=${METRICS_PRODUCERS_STEP_SEC:300}
metrics.producers.concurrency=${METRICS_PRODUCERS_CONCURRENCY:10}
# A full sweep takes ~10 min; keep the TTL well above that.
metrics.producers.ttl-seconds=${METRICS_PRODUCERS_TTL_SEC:1800}
metrics.producers.probe-timeout-seconds=${METRICS_PRODUCERS_PROBE_TIMEOUT_SEC:30}
# Build at boot (used by the alert editor). Set false on a laptop with frequent restarts.
metrics.producers.prewarm=${METRICS_PRODUCERS_PREWARM:true}

# --- Infrastructure utilization (Resources screen: CPU / Memory / Disk / NFS) ---
infrastructure.enabled=${INFRASTRUCTURE_ENABLED:true}
# Org holding the cluster metrics (NOT the requesting org). Blank = openobserve.org.
infrastructure.metrics-org=${INFRASTRUCTURE_METRICS_ORG:}
infrastructure.cache-seconds=${INFRASTRUCTURE_CACHE_SEC:15}
# Lookback ladder for Disk/NFS, narrowest first.
infrastructure.windows=${INFRASTRUCTURE_WINDOWS:now-15m,now-30m,now-1h}
# Disk/NFS only: drop series older than this from the aggregate. 0 disables.
infrastructure.stale-after-seconds=${INFRASTRUCTURE_STALE_AFTER_SEC:1800}
# Disk/NFS only: LATEST (newest sample) or AVERAGE (window mean; auto-selected if LATEST is refused).
infrastructure.value-aggregate=${INFRASTRUCTURE_VALUE_AGGREGATE:LATEST}
infrastructure.node-column=${INFRASTRUCTURE_NODE_COLUMN:k8s_node_name}

# CPU / Memory: pod-scoped SQL. Blank uses the defaults in InfrastructureProperties
# (DEFAULT_CPU_SQL / DEFAULT_MEMORY_SQL). Must project pct, detail, last_seen; no _timestamp predicate.
infrastructure.cpu.sql=${INFRASTRUCTURE_CPU_SQL:}
infrastructure.memory.sql=${INFRASTRUCTURE_MEM_SQL:}
# Card header label - keep in sync with the workload the SQL selects.
infrastructure.cpu.scope=${INFRASTRUCTURE_CPU_SCOPE:tiotopenobserve pods}
infrastructure.memory.scope=${INFRASTRUCTURE_MEM_SCOPE:tiotopenobserve pods}

# Disk
infrastructure.disk.stream=${INFRASTRUCTURE_DISK_STREAM:system_filesystem_usage}
infrastructure.disk.state-column=state
infrastructure.disk.used-state=used
infrastructure.disk.free-state=free
infrastructure.disk.mountpoint-column=mountpoint
infrastructure.disk.device-column=device
infrastructure.disk.type-column=type
infrastructure.disk.exclude-types=${INFRASTRUCTURE_DISK_EXCLUDE_TYPES:tmpfs,devtmpfs,overlay,squashfs,ramfs,iso9660,autofs}

# NFS storage (kubelet volume metrics)
infrastructure.nfs.capacity-stream=${INFRASTRUCTURE_NFS_CAPACITY_STREAM:k8s_volume_capacity}
infrastructure.nfs.available-stream=${INFRASTRUCTURE_NFS_AVAILABLE_STREAM:k8s_volume_available}
infrastructure.nfs.windows=${INFRASTRUCTURE_NFS_WINDOWS:now-30m,now-2h}
infrastructure.nfs.volume-column=k8s_volume_name
infrastructure.nfs.namespace-column=k8s_namespace_name
infrastructure.nfs.pod-column=k8s_pod_name
infrastructure.nfs.volume-type-column=k8s_volume_type
infrastructure.nfs.volume-types=${INFRASTRUCTURE_NFS_VOLUME_TYPES:persistentVolumeClaim}
# Required: PVCs on the same export all report its full size; this stops it being counted many times.
infrastructure.nfs.dedupe-by-capacity=${INFRASTRUCTURE_NFS_DEDUPE:true}

# --- Alert ingest (polls firings from an OpenObserve stream; there is no webhook) ---
alerts.ingest.enabled=${ALERTS_INGEST_ENABLED:true}
alerts.ingest.stream=${ALERTS_INGEST_STREAM:alert_events}
alerts.ingest.stream-type=${ALERTS_INGEST_STREAM_TYPE:logs}
# Skip the cursor to the stream's first data (keeps things safe when openobserve.host changes).
alerts.ingest.fast-forward-to-stream-start=${ALERTS_INGEST_FAST_FORWARD:true}
# Empty = default org only.
alerts.ingest.orgs=${ALERTS_INGEST_ORGS:}
alerts.ingest.interval-ms=${ALERTS_INGEST_INTERVAL_MS:30000}
alerts.ingest.initial-delay-ms=${ALERTS_INGEST_INITIAL_DELAY_MS:20000}
alerts.ingest.backfill-minutes=${ALERTS_INGEST_BACKFILL_MINUTES:1440}
alerts.ingest.batch-size=${ALERTS_INGEST_BATCH_SIZE:500}
alerts.ingest.overlap-seconds=${ALERTS_INGEST_OVERLAP_SECONDS:60}
alerts.ingest.failures-before-alarm=${ALERTS_INGEST_FAILURES_BEFORE_ALARM:3}
alerts.ingest.max-window-minutes=${ALERTS_INGEST_MAX_WINDOW_MINUTES:15}
# Jump to the present if the cursor falls this many hours behind (alerts in the gap are skipped). 0 = never.
alerts.ingest.max-backlog-hours=${ALERTS_INGEST_MAX_BACKLOG_HOURS:24}
# Consecutive partial reads of a catch-up chunk before it is skipped.
alerts.ingest.partial-retries-before-skip=${ALERTS_INGEST_PARTIAL_RETRIES:3}
alerts.ingest.max-payload-chars=${ALERTS_INGEST_MAX_PAYLOAD_CHARS:8000}
alerts.ingest.source-label=${ALERTS_INGEST_SOURCE_LABEL:stream}
# Fingerprint / incident grouping key. Tokens: org, alertName, incidentType, streamType, streamName,
# severity, serviceName, namespace, entities. Unknown tokens fail startup. Do not add streamName.
alerts.ingest.identity-fields=${ALERTS_IDENTITY_FIELDS:org,serviceName,incidentType}
# Field mapping overrides merge with the defaults, e.g.
# alerts.ingest.mapping.fields.alertName=alertname,alert_name,alertName,alert,name,title

# --- Alert lifecycle ---
# Reject acknowledge without a named actor.
alerts.lifecycle.require-actor-on-acknowledge=${ALERTS_REQUIRE_ACK_ACTOR:true}
alerts.lifecycle.stale-after-minutes=${ALERTS_STALE_AFTER_MINUTES:1440}
alerts.lifecycle.max-payload-chars=${ALERTS_MAX_PAYLOAD_CHARS:8000}
alerts.lifecycle.auto-resolve-enabled=${ALERTS_AUTO_RESOLVE_ENABLED:true}
# Must be > 0.
alerts.lifecycle.sweeper-interval-ms=${ALERTS_SWEEPER_INTERVAL_MS:60000}
alerts.lifecycle.sweeper-initial-delay-ms=${ALERTS_SWEEPER_INITIAL_DELAY_MS:30000}
alerts.lifecycle.sweeper-batch-size=${ALERTS_SWEEPER_BATCH_SIZE:500}

# --- Incident aggregation ---
# Least severe first. Empty or duplicate list fails startup.
alerts.incident.severity-order=${ALERTS_SEVERITY_ORDER:info,warning,error,critical,disaster}
# Strip a trailing severity token from rule names so "<x>-warning" and "<x>-disaster" are one incident.
alerts.incident.strip-severity-suffix=${ALERTS_STRIP_SEVERITY_SUFFIX:true}
alerts.incident.max-attributes=${ALERTS_MAX_ATTRIBUTES:60}
alerts.incident.exclude-attributes=${ALERTS_EXCLUDE_ATTRIBUTES:description,summary,text,message,body,raw_payload}

# --- Alerts table display ---
# One row per alert (newest episode); ?collapse=false returns every episode.
alerts.display.collapse-episodes=${ALERTS_COLLAPSE_EPISODES:true}
# Payload keys as `key` or `key:unit`, most specific first. Units are never guessed.
alerts.display.used-fields=${ALERTS_USED_FIELDS:used_mb:MB,used_gb:GB,used_bytes:B,current_bytes:B,used}
alerts.display.limit-fields=${ALERTS_LIMIT_FIELDS:limit_mb:MB,total_gb:GB,limit_gb:GB,limit_bytes:B,alert_threshold,threshold,limit}
# Read limits from the alert_events stream, falling back to the stored payload per row.
alerts.display.limit-from-stream=${ALERTS_LIMIT_FROM_STREAM:true}
# Cache TTL must exceed the ~19 s build time or it never hits.
alerts.display.stream-lookback-minutes=${ALERTS_LIMIT_LOOKBACK_MIN:360}
alerts.display.stream-max-rows=${ALERTS_LIMIT_MAX_ROWS:2000}
alerts.display.stream-cache-seconds=${ALERTS_LIMIT_CACHE_SEC:120}
alerts.display.display-fields=${ALERTS_DISPLAY_FIELDS:display_value,display,value_display}
# Linking alerts to rules requires "rule_name": "{alert_name}" in the OpenObserve notification template.
alerts.display.rule-name-fields=${ALERTS_RULE_NAME_FIELDS:rule_name,rule,alert_rule_name,alert_rule,ruleName}

# --- Alert rule synchronisation (PostgreSQL is the source of truth) ---
alerts.rule-sync.fail-create-on-sync-error=${ALERTS_FAIL_CREATE_ON_SYNC_ERROR:true}
alerts.rule-sync.fail-update-on-sync-error=${ALERTS_FAIL_UPDATE_ON_SYNC_ERROR:false}
# Without the history destination, rules fire but never reach the Alerts screen.
alerts.rule-sync.auto-attach-history-destination=${ALERTS_AUTO_ATTACH_HISTORY:true}
alerts.rule-sync.history-destination-name=${ALERTS_HISTORY_DESTINATION:trinity_alert_history}
alerts.rule-sync.history-template-name=${ALERTS_HISTORY_TEMPLATE:trinity_alert_history}
# Empty = derived from openobserve.host and the ingest stream.
alerts.rule-sync.history-destination-url=${ALERTS_HISTORY_DESTINATION_URL:}
alerts.rule-sync.history-destination-skip-tls-verify=${ALERTS_HISTORY_SKIP_TLS:false}
alerts.rule-sync.retry-interval-ms=${ALERTS_SYNC_RETRY_INTERVAL_MS:300000}
alerts.rule-sync.retry-initial-delay-ms=${ALERTS_SYNC_RETRY_INITIAL_DELAY_MS:60000}
alerts.rule-sync.retry-batch-size=${ALERTS_SYNC_RETRY_BATCH_SIZE:50}

# --- Stream name catalog (cached; expired entries served while refreshing) ---
alerts.stream-catalog.ttl-seconds=${ALERTS_STREAM_CATALOG_TTL_SEC:60}
alerts.stream-catalog.metrics-ttl-seconds=${ALERTS_STREAM_CATALOG_METRICS_TTL_SEC:600}
alerts.stream-catalog.prewarm=${ALERTS_STREAM_CATALOG_PREWARM:true}

# --- Alert persistence (PostgreSQL) ---
# false = no datasource, JPA, Flyway or persistence beans.
alerts.persistence.enabled=${ALERTS_PERSISTENCE_ENABLED:true}

spring.datasource.url=${ALERTS_DB_URL:jdbc:postgresql://192.168.110.160:5432/openobserve}
spring.datasource.username=${ALERTS_DB_USERNAME:postgres}
spring.datasource.password=${ALERTS_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=alerts-pool
spring.datasource.hikari.maximum-pool-size=${ALERTS_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${ALERTS_DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${ALERTS_DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${ALERTS_DB_VALIDATION_TIMEOUT_MS:5000}

# Flyway owns the schema - keep validate, never update.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=${ALERTS_DB_BATCH_SIZE:25}
spring.jpa.show-sql=${ALERTS_DB_SHOW_SQL:false}

spring.flyway.enabled=${ALERTS_DB_MIGRATE:${ALERTS_PERSISTENCE_ENABLED:true}}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Grafana dashboards (token stays server-side) ---
grafana.enabled=${GRAFANA_ENABLED:true}
grafana.base-url=${GRAFANA_BASE_URL:}
# VIEWER-role service-account token (glsa_...). Set via env var only - never commit it.
grafana.token=${GRAFANA_SA_TOKEN:}
grafana.org-id=${GRAFANA_ORG_ID:1}
grafana.request-timeout-seconds=${GRAFANA_REQUEST_TIMEOUT_SECONDS:20}
# Panel queries can legitimately be slow, hence the separate, longer timeout.
grafana.query-timeout-seconds=${GRAFANA_QUERY_TIMEOUT_SECONDS:90}
grafana.search-limit=${GRAFANA_SEARCH_LIMIT:500}
# Keep false; only for internal self-signed certs.
grafana.tls-insecure=${GRAFANA_TLS_INSECURE:false}
# Allowed folder UIDs (subtrees included). Default is the "OpenObserver" folder; empty = whole instance.
grafana.allowed-folder-uids=${GRAFANA_ALLOWED_FOLDER_UIDS:cfw55av9vb4sga}
# GLOBAL (one list) or ORG (per organization).
grafana.registry.scope=${GRAFANA_REGISTRY_SCOPE:GLOBAL}
# AUTO (Postgres if available, else file), POSTGRES or FILE.
grafana.registry.store=${GRAFANA_REGISTRY_STORE:AUTO}
# FILE store only.
grafana.registry.file=${GRAFANA_REGISTRY_FILE:data/grafana-dashboard-registry.json}
